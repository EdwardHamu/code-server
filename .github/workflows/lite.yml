name: Lightweight editor
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build
      - run: npm test
      - run: npm run measure
      - run: npm pack --ignore-scripts
      - run: bash scripts/test-release-ubuntu.sh
      - run: bash ci/test-build-ubuntu-package.sh
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        with:
          name: code-server-lite-${{ matrix.os }}
          path: code-server-*.tgz
