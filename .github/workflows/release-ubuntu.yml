name: Release Ubuntu
run-name: release-ubuntu/${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag, for example v0.1.0-lite.1
        required: true
        type: string
      source_sha:
        description: 40-character commit SHA to package
        required: true
        type: string
      request_id:
        description: Correlation id from scripts/release-ubuntu.sh
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-ubuntu-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  package-ubuntu-18-10:
    name: Ubuntu 18.10 amd64 package
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      REQUEST_ID: ${{ inputs.request_id }}
      GH_TOKEN: ${{ github.token }}
      GH_HOST: github.com
      GH_PROMPT_DISABLED: '1'
      GH_PAGER: cat
      NODE_VERSION: '24.12.0'
    steps:
      - name: Validate dispatch inputs
        run: |
          set -euo pipefail
          [[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]
          [[ $SOURCE_SHA =~ ^[0-9a-fA-F]{40}$ ]]
          [[ $REQUEST_ID =~ ^[A-Za-z0-9-]{1,80}$ ]]
          echo "Packaging Ubuntu 18.10 amd64 from $SOURCE_SHA as $RELEASE_TAG"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          submodules: false

      - name: Confirm checked-out commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Offline release-script tests
        run: bash scripts/test-release-ubuntu.sh

      - name: Build Ubuntu 18.10 amd64 packages
        run: |
          set -euo pipefail
          retry() {
            local attempt=1 delay=2 rc=1
            while (( attempt <= 5 )); do
              if "$@"; then return 0; else rc=$?; fi
              echo "retry $attempt failed ($rc): $*" >&2
              if (( attempt < 5 )); then sleep "$delay"; delay=$((delay * 2)); (( delay <= 30 )) || delay=30; fi
              attempt=$((attempt + 1))
            done
            return "$rc"
          }
          mkdir -p dist
          retry bash ci/build-ubuntu-package.sh \
            --repo-root "$GITHUB_WORKSPACE" \
            --tag "$RELEASE_TAG" \
            --output-dir "$GITHUB_WORKSPACE/dist" \
            --node-version "$NODE_VERSION"
          ls -l dist
          test -s dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          dpkg-deb -I dist/code-server_*.deb | tee /tmp/deb-info.txt
          grep -q 'Ubuntu 18.10' /tmp/deb-info.txt
          grep -q 'libc6 (>= 2.28)' /tmp/deb-info.txt
          grep -q 'Architecture: amd64' /tmp/deb-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-18.10-amd64-${{ inputs.release_tag }}
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Release
        run: |
          set -euo pipefail
          retry() {
            local attempt=1 delay=2 rc=1
            while (( attempt <= 5 )); do
              if "$@"; then return 0; else rc=$?; fi
              echo "retry $attempt failed ($rc): $*" >&2
              if (( attempt < 5 )); then sleep "$delay"; delay=$((delay * 2)); (( delay <= 30 )) || delay=30; fi
              attempt=$((attempt + 1))
            done
            return "$rc"
          }
          exists=0
          for attempt in 1 2 3 4 5; do
            http=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --silent --include 2>/dev/null | tr -d '\r' | awk 'NR==1{print $2; exit}')
            case "$http" in
              200) exists=1; break ;;
              404) exists=0; break ;;
              *) echo "release lookup HTTP ${http:-none}, attempt $attempt" >&2; sleep $((attempt * 2)) ;;
            esac
            if [[ $attempt == 5 ]]; then echo "cannot determine whether $RELEASE_TAG exists" >&2; exit 1; fi
          done
          if [[ $exists == 1 ]]; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
          notes=$(mktemp)
          cat > "$notes" <<EOF
          Ubuntu 18.10 (cosmic) amd64 installer for code-server lite.

          - Target: Ubuntu 18.10, glibc >= 2.28, amd64
          - Bundled Node.js ${NODE_VERSION} linux-x64
          - Source: \`${SOURCE_SHA}\`
          - Request: \`${REQUEST_ID}\`

          Ubuntu 18.10 is end-of-life. Install with:

          \`\`\`bash
          sudo apt-get install ./code-server_*_amd64.deb
          \`\`\`

          Git is required on the host. Set PASSWORD and run \`code-server --root /path\`.
          EOF
          retry gh release create "$RELEASE_TAG" dist/*.deb dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Ubuntu 18.10 $RELEASE_TAG" \
            --notes-file "$notes"
